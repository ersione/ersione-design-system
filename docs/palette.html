<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ersione · 컬러 팔레트</title><link rel="stylesheet" href="../styles.css"><style>
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.7 system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:40px 24px}h1{font-size:36px;letter-spacing:-1px;margin:8px 0}h2{font-size:20px;margin:36px 0 14px}p{color:var(--muted)}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}.controls{display:flex;align-items:center;gap:12px}.palette{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}.swatch{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}.swatch i{display:block;height:100px;background:var(--swatch)}.swatch div{padding:16px}.swatch b{display:block;font-size:16px}.swatch code{color:var(--muted);font-size:13px}.semantic{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.semantic div{padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:16px}.semantic strong{display:block;color:var(--swatch);font-size:28px}.semantic small{display:block;color:var(--muted)}.chart{padding:24px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}.legend{display:flex;gap:20px;flex-wrap:wrap}.legend span{color:var(--swatch)}.eyebrow{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:2px}a{color:var(--accent)}@media(max-width:650px){main{padding:24px 16px}.palette{grid-template-columns:repeat(2,minmax(0,1fr))}.semantic{grid-template-columns:1fr}.swatch i{height:64px}}
</style></head><body class="eds-theme" data-brand="blue" data-dark="false"><main>
<div class="top"><div><span class="eyebrow">ERSIONE / COLOR SYSTEM</span><h1>같은 의미에는, 같은 색.</h1><p>핵심 수치는 선명하게. 배경과 보조 정보는 조용하게.</p></div><div class="controls"><select class="eds-select eds-control--md" aria-label="브랜드"><option value="blue">블루 브랜드</option><option value="orange">오렌지 브랜드</option></select><label><input class="eds-switch" type="checkbox" role="switch"> 다크 모드</label></div></div>
<h2>함께 쓰는 다섯 가지 색</h2><div class="palette" id="palette"></div>
<h2>데이터의 의미에 맞춘 강조</h2><div class="semantic" id="semantic"></div>
<h2>차트에도 같은 팔레트</h2><div class="chart"><svg viewBox="0 0 800 180" role="img" aria-label="가상 데이터 차트: 인원 블루, 금액 틸, 변동 앰버" style="width:100%"><g stroke="var(--chart-grid)"><path d="M30 30H780M30 80H780M30 130H780"/></g><path d="M30 140L180 115L330 125L480 60L630 75L780 25" stroke="var(--data-people)" stroke-width="3" fill="none"/><path d="M30 160L180 145L330 110L480 130L630 100L780 65" stroke="var(--data-salary)" stroke-width="3" stroke-dasharray="7 4" fill="none"/><path d="M30 120L180 135L330 145L480 110L630 130L780 100" stroke="var(--data-flow)" stroke-width="3" stroke-dasharray="2 5" fill="none"/></svg><div class="legend"><span style="--swatch:var(--data-people)">● 인원·규모</span><span style="--swatch:var(--data-salary)">━ 금액·급여</span><span style="--swatch:var(--data-flow)">┄ 변동</span></div><p>가상 데이터 · 실제 통계 아님. 증감은 부호·문구와 함께 표시합니다.</p></div><p><a href="../examples/react/">React 컴포넌트 예제 →</a></p>
</main><script>
const names=['블루','틸','앰버','퍼플','로즈'];
document.querySelector('#palette').innerHTML=names.map((name,i)=>`<div class="swatch" style="--swatch:var(--chart-series-${i+1})"><i></i><div><b>${name}</b><code data-token="chart-series-${i+1}"></code></div></div>`).join('');
const roles=[['primary','주요 강조','브랜드에 따라 전환','+31.7%'],['people','인원·규모','data-people','+83명'],['salary','금액·급여','data-salary','-0.6%'],['joiners','신규취득','data-joiners','156명'],['departures','자격상실','data-departures','72명'],['flow','변동','data-flow','+84명']];
document.querySelector('#semantic').innerHTML=roles.map(([key,name,desc,value])=>`<div style="--swatch:var(--data-${key})"><span>${name}</span><strong>${value}</strong><small>${desc}</small></div>`).join('');
function update(){const style=getComputedStyle(document.body);document.querySelectorAll('[data-token]').forEach(node=>node.textContent=style.getPropertyValue('--'+node.dataset.token).trim());}
document.querySelector('select').onchange=e=>{document.body.dataset.brand=e.target.value;update();};document.querySelector('input').onchange=e=>{document.body.dataset.dark=e.target.checked;update();};update();
</script></body></html>
